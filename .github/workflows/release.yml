name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Keep the workflow disabled in repository settings as well: historical tags
# still contain the old publisher. This file blocks publication on new tags.
permissions:
  contents: read

jobs:
  publication-blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Block distribution of private implementation
        run: |
          echo '::error::Worker bundles include readable implementation from the private monocle-edge-core repository. Public release publication is blocked. Use an approved access-controlled deployment path. Re-enabling publication requires an explicit distribution decision and review of the actual artifact.'
          exit 1
